# ==============================================================================
# n8n Docker Compose Configuration
# ==============================================================================
# This file defines the infrastructure for running a consistent, production-ready
# n8n environment backed by a PostgreSQL database.
#
# Before running:
#   1. Copy .env.example to .env and configure your credentials.
#   2. Run 'docker compose up -d' to start the containers.
# ==============================================================================

services:
  # --- PostgreSQL Database Service ---
  postgres:
    image: postgres:16-alpine
    container_name: n8n_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-n8n_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - n8n_net
    # Network Isolation: Postgres port 5432 is not exposed to the host machine.
    # It can only be accessed internally by n8n within the virtual 'n8n_net' network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-n8n_admin} -d $${POSTGRES_DB:-n8n_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Custom n8n Automation Service ---
  n8n:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: n8n_app
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      # General Configuration
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - NODE_ENV=${NODE_ENV:-production}

      # Database Configuration
      - N8N_DB_TYPE=${N8N_DB_TYPE:-postgresdb}
      - N8N_DB_POSTGRESDB_HOST=${N8N_DB_POSTGRESDB_HOST:-postgres}
      - N8N_DB_POSTGRESDB_PORT=${N8N_DB_POSTGRESDB_PORT:-5432}
      - N8N_DB_POSTGRESDB_DATABASE=${N8N_DB_POSTGRESDB_DATABASE:-n8n_db}
      - N8N_DB_POSTGRESDB_USER=${N8N_DB_POSTGRESDB_USER:-n8n_admin}
      - N8N_DB_POSTGRESDB_PASSWORD=${N8N_DB_POSTGRESDB_PASSWORD}

      # Execution Logging & Auto-Pruning (Best Practice to avoid DB bloat)
      - EXECUTIONS_DATA_PRUNE=${EXECUTIONS_DATA_PRUNE:-true}
      - EXECUTIONS_DATA_MAX_AGE=${EXECUTIONS_DATA_MAX_AGE:-168}
      - EXECUTIONS_DATA_PRUNE_TIMEOUT=${EXECUTIONS_DATA_PRUNE_TIMEOUT:-3600}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - n8n_net
    depends_on:
      postgres:
        condition: service_healthy

# --- Volume and Network Specifications ---
volumes:
  # Persistent storage for PostgreSQL
  postgres_data:
    driver: local
  # Persistent storage for n8n settings, workflows, and temporary local execution data
  n8n_data:
    driver: local

networks:
  # Isolated network for service security
  n8n_net:
    driver: bridge
